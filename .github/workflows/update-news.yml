name: Update GGNesia News

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ggnesia-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install rss-parser cheerio

      - name: Fetch latest news
        run: node scripts/fetch-news.js

      - name: Save updated news
        run: |
          git config user.name "GGNesia Bot"
          git config user.email "actions@github.com"

          git add data/articles.json

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan berita."
            exit 0
          fi

          git commit -m "Update berita GGNesia"

          git pull --rebase origin main

          git push
