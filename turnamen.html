<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnamen Esports - GGNesia</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="container">
        <div class="logo">
            <span>GG</span>Nesia
        </div>

        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="index.html">Mobile</a>
            <a href="index.html">PC</a>
            <a href="index.html">Console</a>
            <a href="index.html">Esports</a>
        </nav>
    </div>
</header>

<main class="container tournament-page">

    <p class="label">ESPORTS HUB</p>

    <h1>🏆 Turnamen Esports</h1>

    <p class="intro">
        Informasi jadwal dan turnamen esports dari berbagai game.
    </p>
<div class="tournament-filters">
    <button class="filter-btn active" data-game="all">Semua</button>
    <button class="filter-btn" data-game="Mobile Legends: Bang Bang">Mobile Legends</button>
    <button class="filter-btn" data-game="PUBG Mobile">PUBG Mobile</button>
    <button class="filter-btn" data-game="Free Fire">Free Fire</button>
</div>
    <div class="tournament-list" id="tournamentList"></div>
<h2 class="schedule-title">🗓️ Jadwal Pertandingan Terdekat</h2>

<div class="match-filters">
    <button class="match-filter-btn active" data-game="all">Semua</button>
    <button class="match-filter-btn" data-game="Mobile Legends: Bang Bang">Mobile Legends</button>
    <button class="match-filter-btn" data-game="PUBG Mobile">PUBG Mobile</button>
    <button class="match-filter-btn" data-game="Free Fire">Free Fire</button>
    <button class="match-filter-btn" data-game="Valorant">Valorant</button>
    <button class="match-filter-btn" data-game="Call of Duty">Call of Duty</button>
    <button class="match-filter-btn" data-game="Garena Delta Force">Garena Delta Force</button>
    <button class="match-filter-btn" data-game="Honor of Kings">Honor of Kings</button>
</div>

<div id="matchList"></div>
</main>

<footer class="footer">
    <div class="footer-logo">
        <span>GG</span>Nesia
    </div>

    <p>Portal Dunia Game & Esports Indonesia</p>

    <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="index.html">Esports</a>
    </div>

    <p class="copyright">
        © 2026 GGNesia. All rights reserved.
    </p>
</footer>


<script>
let tournaments = [];

async function loadTournaments() {
    const list = document.getElementById("tournamentList");

    try {
        const response = await fetch("data/tournaments.json");
        tournaments = await response.json();

        showTournaments("all");
    } catch (error) {
        list.innerHTML = "<p>Gagal memuat data turnamen.</p>";
    }
}

function showTournaments(game) {
    const list = document.getElementById("tournamentList");

    const filtered = game === "all"
        ? tournaments
        : tournaments.filter(tournament => tournament.game === game);

    list.innerHTML = filtered.map(tournament => `
        <div class="tournament-card">
            <h2>🏆 ${tournament.name}</h2>
            <p><strong>Game:</strong> ${tournament.game}</p>
            <p><strong>Status:</strong> <span class="status-badge ${tournament.status.toLowerCase()}">${tournament.status}</span></p>
            <p><strong>Tanggal:</strong> ${tournament.date}</p>
            <p><strong>Lokasi:</strong> ${tournament.location}</p>
        </div>
    `).join("");
}
async function loadMatches(game = "all") {
    const matchList = document.getElementById("matchList");

    try {
        const response = await fetch("data/matches.json");
        const matches = await response.json();

        const filteredMatches = game === "all"
            ? matches
            : matches.filter(match => match.game === game);

        matchList.innerHTML = filteredMatches.map(match => `
            <div class="match-card">
                <p class="match-tournament">${match.tournament}</p>
                <h3>${match.team1} ⚔️ ${match.team2}</h3>
                <p>📅 ${match.date}</p>
                <p>⏰ ${match.time}</p>
                <p>🎮 ${match.game}</p>
            </div>
        `).join("");

    } catch (error) {
        matchList.innerHTML = "<p>Gagal memuat jadwal pertandingan.</p>";
    }
}
} document.querySelectorAll(".match-filter-btn").forEach(button => {
    button.addEventListener("click", () => {
        document.querySelectorAll(".match-filter-btn").forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        loadMatches(button.dataset.game);
    });
});
document.querySelectorAll(".filter-btn").forEach(button => {
    button.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        showTournaments(button.dataset.game);
    });
});

loadTournaments();
loadMatches();
</script>


</body>
</html>
